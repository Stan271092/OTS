<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OTS — композиция из прозрачных пластин</title>
<style>
@font-face{font-family:Oswald;src:url(assets/fonts/oswald-400-cyrillic.woff2);font-weight:400;font-display:swap}
@font-face{font-family:Roboto;src:url(assets/fonts/roboto-400-cyrillic.woff2);font-weight:400;font-display:swap}
*{box-sizing:border-box}body{margin:0;background:#f2f6fa;color:#26313d;font-family:Roboto,Arial,sans-serif}
main{max-width:1120px;margin:auto;padding:28px 24px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px}h1{font:400 23px/1.3 Oswald,Arial,sans-serif;margin:0}p{font-size:12px;line-height:1.6;color:#68757f;margin:8px 0 0}
button{border:1px solid #b6d7f6;border-radius:12px;background:#fff;color:#2459ed;padding:12px 18px;cursor:pointer;font:inherit;font-size:12px;flex-shrink:0}button:focus-visible{outline:3px solid #2459ed;outline-offset:3px}
.stage{position:relative;overflow:hidden;border-radius:24px;border:1px solid #e1e7eb;background:#f8f9fa;max-width:820px;margin:auto;aspect-ratio:1/1}.stage svg{display:block;width:100%;height:100%}
.float{animation:float 14s ease-in-out infinite;transform-origin:400px 400px}.p2{animation-delay:-3s}.p3{animation-delay:-6s}.p4{animation-delay:-9s}.p5{animation-delay:-12s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.paused .float{animation-play-state:paused}
.note{max-width:820px;margin:14px auto 0}
@media(prefers-reduced-motion:reduce){.float{animation:none}}
@media(max-width:560px){main{padding:20px 14px}header{align-items:flex-start}h1{font-size:20px}button{padding:10px 12px}}
</style>
</head>
<body>
<main>
<header><div><h1>Строительство — слои материала</h1><p>Авторская векторная проба · бело-серебристый материал и голубые грани</p></div><button type="button" id="motion" aria-pressed="false">Остановить движение</button></header>
<div class="stage" id="stage">
<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="art-title art-desc">
<title id="art-title">Пять разнесённых полупрозрачных пластин</title>
<desc id="art-desc">Вертикальные пластины с мягкими серебристыми отражениями, тонкими голубыми торцами и светлым фоном.</desc>
<defs>
<radialGradient id="background" cx="48%" cy="42%" r="75%"><stop stop-color="#fff"/><stop offset=".65" stop-color="#f7f8f9"/><stop offset="1" stop-color="#eef1f4"/></radialGradient>
<linearGradient id="face" x1="0" y1="0" x2="1" y2=".4"><stop stop-color="#e8e9eb" stop-opacity=".8"/><stop offset=".18" stop-color="#e4e6e9" stop-opacity=".48"/><stop offset=".48" stop-color="#cdd0d5" stop-opacity=".32"/><stop offset=".73" stop-color="#f0f1f2" stop-opacity=".65"/><stop offset=".91" stop-color="#9299a4" stop-opacity=".4"/><stop offset="1" stop-color="#f1f2f3" stop-opacity=".8"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2=".45" y2="1"><stop stop-color="#f2f3f4"/><stop offset=".16" stop-color="#c6cbd2"/><stop offset=".33" stop-color="#697383"/><stop offset=".48" stop-color="#e0e5eb"/><stop offset=".58" stop-color="#bfd6e8"/><stop offset=".64" stop-color="#76b6e7"/><stop offset=".73" stop-color="#c5d9e7"/><stop offset=".86" stop-color="#d8dce2"/><stop offset="1" stop-color="#eff1f3"/></linearGradient>
<linearGradient id="top" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e6e8eb"/><stop offset=".38" stop-color="#b9c1ca"/><stop offset=".65" stop-color="#dce5ed"/><stop offset=".82" stop-color="#8ebfe7"/><stop offset="1" stop-color="#e9ebed"/></linearGradient>
<linearGradient id="glint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".45" stop-color="#fff" stop-opacity=".04"/><stop offset=".5" stop-color="#fff" stop-opacity=".52"/><stop offset=".53" stop-color="#9faab8" stop-opacity=".25"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="outline" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".45" stop-color="#fff"/><stop offset=".75" stop-color="#a7b6c6" stop-opacity=".65"/><stop offset="1" stop-color="#fff"/></linearGradient>
<filter id="ground" x="-40%" y="-150%" width="180%" height="400%"><feGaussianBlur stdDeviation="17"/></filter>
<g id="plate">
<!-- Собственная геометрия: скруглённая пластина и тонкие торцы. -->
<path d="M15 4 Q22 -1 32 5 L168 78 Q180 84 180 99 L180 341 Q180 353 172 359 L164 364 L164 104 Q164 89 153 83 Z" fill="url(#edge)"/>
<path d="M7 9 15 4 Q22 -1 32 5 L168 78 Q179 84 179 96 L169 101 Q166 90 157 86 L21 13 Q12 8 7 14Z" fill="url(#top)"/>
<path d="M7 9 Q13 5 24 11 L160 84 Q172 90 172 105 L172 350 Q172 369 157 361 L21 288 Q7 281 7 266Z" fill="url(#face)" stroke="url(#outline)" stroke-width="1.4"/>
<path d="M18 19 157 94 Q163 97 163 109 L163 346 150 339 18 48Z" fill="url(#glint)" opacity=".75"/>
<path d="M10 24 10 263 Q10 276 23 283 L155 354" fill="none" stroke="#d7dce2" stroke-width="2" opacity=".72"/>
<path d="M176 124 176 329" fill="none" stroke="#f5fbff" stroke-width="1.2" opacity=".9"/>
<path d="M23 13 158 86" fill="none" stroke="#fff" stroke-width="2"/>
</g>
</defs>
<path fill="url(#background)" d="M0 0H800V800H0Z"/>
<ellipse cx="406" cy="674" rx="211" ry="21" fill="#7f96ad" opacity=".12" filter="url(#ground)"/>
<g transform="translate(497 165)"><g class="float p5"><use href="#plate"/></g></g>
<g transform="translate(404 211)"><g class="float p4"><use href="#plate"/></g></g>
<g transform="translate(311 257)"><g class="float p3"><use href="#plate"/></g></g>
<g transform="translate(218 303)"><g class="float p2"><use href="#plate"/></g></g>
<g transform="translate(125 349)"><g class="float"><use href="#plate"/></g></g>
</svg>
</div>
<p class="note">Проба формы и материала, не финальный фотореалистичный рендер. Текущий раздел сайта и hero не изменены.</p>
</main>
<script>
const button=document.querySelector('#motion');
button.addEventListener('click',()=>{const paused=document.querySelector('#stage').classList.toggle('paused');button.setAttribute('aria-pressed',String(paused));button.textContent=paused?'Продолжить движение':'Остановить движение';});
</script>
</body>
</html>
